<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8"/>
    <title>AEGIS FIT</title>
    <style>
        /* CSS ฉบับปรับปรุง: Fun & Friendly (Gumroad-Inspired) */
        :root {
            --primary-color: #00CC88; /* เขียวสดใส */
            --accent-color: #8A2BE2; /* ม่วง */
            --text-color: #333;
            --bg-color: #F8F8F8; /* พื้นหลังสีขาวนวล */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* ฟอนต์ที่ดูเป็นมิตร */
            background: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            padding: 4rem;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent-color); /* ใช้สีม่วงสำหรับหัวข้อ */
            font-weight: 800;
        }
        p {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            color: var(--text-color);
        }
        .btn {
            background: var(--primary-color);
            color: white; /* เปลี่ยนเป็นสีขาวเพื่อให้ตัดกับพื้นหลัง */
            padding: 1.2rem 3rem;
            border-radius: 12px; /* ขอบมนมากขึ้น */
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 204, 136, 0.4); /* เพิ่มเงาให้ดูเด้ง */
            font-size: 1.1rem;
        }
        .btn:hover {
            background: #00A36A; /* สีเข้มขึ้นเมื่อ Hover */
            box-shadow: 0 6px 20px rgba(0, 204, 136, 0.6);
            transform: translateY(-2px); /* เอฟเฟกต์ยกขึ้นเล็กน้อย */
        }
    </style>
</head>
<body>
    <h1>AEGIS FIT</h1>
    <p>AI วางแผน • นับแคล • ลีดเดอร์บอร์ด</p>
    <a class="btn" href="https://aegis-fit.onrender.com/docs">สมัครเลย - ฿2,990/ปี</a>
</body>
</html>
